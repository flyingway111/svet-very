services:
  - type: web
    name: svet-very
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: BOT_TOKEN
        sync: false
      - key: POLZA_API_KEY
        sync: false
      - key: WEBAPP_URL
        sync: false
